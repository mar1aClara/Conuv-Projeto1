<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Cadastre seu interesse em adoção ou voluntariado no Apoio Pet." />
	<link rel="stylesheet" href="styles.css">
	<title>Cadastro | Apoio Pet</title>
</head>
<body class="pagina-cadastro">
	<header class="cabecalho-site">
        <a class="logotipo" href="index.html">
            <img id="logoimg" src="/img/logo.png" alt="Logo Apoio Pet">
            <p class="centralizacao">Apoio<strong>Pet</strong></p>
        </a>
        <nav class="navegacao">
            <a href="index.html#adocao">Conhecer animais</a>
			<a href="index.html">Voltar ao início</a>
        </nav>
    </header>

	<main class="conteudo-cadastro">
		<div class="introducao-cadastro">
			<h1>Uma boa história começa com um <em>oi.</em></h1>
			<p>Conte um pouquinho sobre você e como gostaria de participar. Estamos felizes com seu interesse.</p>
		</div>

		<form class="formulario-cadastro" id="formulario">
			<h2>Seus dados</h2>
			<div class="grade-formulario">
				<div class="campo-formulario campo-formulario-integral">
					<label for="nome">Nome completo</label>
					<input id="nome" name="nome" type="text" autocomplete="name" placeholder="Como podemos chamar você?" required>
				</div>
				<div class="campo-formulario">
					<label for="email">E-mail</label>
					<input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
				</div>
				<div class="campo-formulario">
					<label for="telefone">Telefone</label>
					<input id="telefone" name="telefone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000" required>
				</div>
				<div class="campo-formulario">
					<label for="dataNascimento">Data de nascimento</label>
					<input id="dataNascimento" name="dataNascimento" type="date" required>
				</div>
				<div class="campo-formulario">
					<label for="senha">Senha</label>
					<input id="senha" name="senha" type="password" placeholder="Crie uma senha segura" required>
				</div>
				<div class="campo-formulario campo-formulario-integral">
					<label for="mensagem">Uma mensagem (opcional)</label>
					<textarea id="mensagem" name="mensagem" placeholder="Conte um pouco sobre sua rotina ou disponibilidade"></textarea>
				</div>
				
			</div>
			<label class="consentimento" for="consentimento">
				<input id="consentimento" name="consentimento" type="checkbox" required>
				<span>Autorizo o contato para conversar sobre meu interesse.</span>
			</label>
			<button class="botao botao-escuro" type="submit">Enviar meu interesse</button>
		</form>
	</main>

	<footer class="rodape-site">
        <p>Mais cuidado, mais encontros felizes.</p>
        <small>© 2026 Apoio Pet</small>
    </footer>
</body>
</html>
